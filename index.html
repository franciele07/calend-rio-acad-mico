<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendário Acadêmico</title>

    <!-- FullCalendar (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">

    <!-- CSS locais -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="calendar"></div>

    <!-- Modal simples para editar eventos -->
    <div id="eventModal" class="modal">
      <div class="modal-content">
        <h3>Editar Evento</h3>
        <input type="text" id="eventTitle" placeholder="Título do evento">
        <button id="saveEvent">Salvar</button>
        <button id="deleteEvent">Excluir</button>
        <button id="closeModal">Fechar</button>
      </div>
    </div>

    <!-- Scripts: FullCalendar (CDN) e JS locais -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
